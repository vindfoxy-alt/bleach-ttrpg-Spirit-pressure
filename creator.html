<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirit Pressure - Character Creator</title>
<meta property="og:title" content="Spirit Pressure - Character Creator">
<meta property="og:description" content="Build a level 1-20 character for the Spirit Pressure tabletop RPG. Pick a class, subclass and ancestry, and get a ready sheet.">
<meta property="og:image" content="https://vindfoxy-alt.github.io/bleach-ttrpg-spirit-pressure/og-image.png">
<style>
:root{--bg:#0e0e12;--panel:#17171d;--line:#2a2a33;--text:#e8e8ee;--mute:#9a9aa8;--c:#B08D2B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 "Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:0 0 .4em;line-height:1.15}
a{color:inherit}
header{padding:22px 20px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header b{font-family:Georgia,serif;letter-spacing:.08em;font-size:20px;margin-right:auto}
header a{color:var(--mute);text-decoration:none;font-size:15px}
.wrap{max-width:1200px;margin:auto;padding:22px 20px 60px;display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:26px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;margin-bottom:16px;border-top:4px solid var(--c)}
.panel h2{font-size:21px}
label{display:block;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
select,input[type=text],input[type=number],textarea{width:100%;background:#0f0f14;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--c);color:#14110d;border:0;border-radius:8px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:15px}
.btn.alt{background:#23232c;color:var(--text);border:1px solid var(--line)}
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.ab{background:#0f0f14;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.ab b{display:block;font-size:13px;color:var(--mute);letter-spacing:.08em}
.ab .mod{font-family:Georgia,serif;font-size:28px}
.ab select{padding:5px;text-align:center}
.mini{font-size:12.5px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer;background:#0f0f14;user-select:none}
.chip.on{background:var(--c);color:#14110d;border-color:var(--c);font-weight:700}
.chip.lock{opacity:.9;border-color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0 4px}
.stat{background:#0f0f14;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}
.stat b{display:block;font-family:Georgia,serif;font-size:28px;color:var(--c)}
.feat{border-left:4px solid var(--c);padding:6px 0 6px 12px;margin:10px 0;background:linear-gradient(90deg,#17171d,transparent)}
.feat h4{margin:0;font-size:16px}
.feat h4 small{color:var(--c);font-size:12px;letter-spacing:.08em;margin-right:6px}
.feat p{margin:3px 0 0;color:#c8c8d2;font-size:15px}
.subcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;background:#0f0f14}
.subcard.on{border-color:var(--c);background:linear-gradient(120deg,color-mix(in srgb,var(--c) 22%,#0f0f14),#0f0f14)}
.subcard b{font-family:Georgia,serif;font-size:19px}
.subcard small{display:block;color:var(--mute)}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:6px}
.sk div{display:flex;justify-content:space-between;gap:8px;padding:4px 9px;border-radius:7px;background:#0f0f14;border:1px solid var(--line);font-size:14.5px}
.sk div.p{border-color:var(--c)}
.sk div.p b{color:var(--c)}
.note{background:#1c1c24;border-radius:8px;padding:9px 12px;color:var(--mute);font-size:14px;margin-top:10px}
@media print{
 body{background:#fff;color:#111}header,.left,.btn,.noprint{display:none!important}
 .wrap{display:block;padding:0}.panel{background:#fff;border:1px solid #888;border-top:4px solid #555;break-inside:avoid}
 .stat,.ab,.sk div{background:#fff;border-color:#999}.stat b,.feat h4 small{color:#222}.feat{background:none}.feat p,.mini{color:#333}
}
</style>
</head>
<body>
<header><b>SPIRIT PRESSURE &middot; CHARACTER CREATOR</b><a href="index.html">Home</a><a href="Spirit_Pressure_Players_Handbook.pdf">Player's Handbook</a><a href="Spirit_Pressure_GM_Guide.pdf">GM Guide</a></header>
<div class="wrap">
<div class="left">
 <div class="panel"><h2>1. Who are you?</h2>
  <label>Character name</label><input type="text" id="name" placeholder="Rin Kurosawa">
  <label>Class</label><select id="cls"></select>
  <label>Level</label><select id="lvl"></select>
  <label>Subclass (from level 2)</label><div id="subpick" class="mini">Reach level 2 to pick a subclass.</div>
 </div>
 <div class="panel"><h2>2. Ancestry and background</h2>
  <label>Ancestry</label><select id="anc"></select>
  <div id="ancextra"></div>
  <label>Background</label><select id="bg"></select>
  <div class="mini" id="bgtext"></div>
 </div>
 <div class="panel"><h2>3. Ability scores</h2>
  <div class="row"><select id="method" style="width:auto"><option value="array">Standard array</option><option value="manual">Type your own</option></select>
  <button class="btn alt" id="roll">Roll 4d6 x6</button></div>
  <div class="abil" id="abil"></div>
  <div class="mini" id="asi"></div>
  <div class="note">Standard array is 15, 14, 13, 12, 10, 8, each used once. Put your highest in your class's spirit ability.</div>
 </div>
 <div class="panel"><h2>4. Skills</h2>
  <div class="mini" id="skinfo"></div>
  <div class="chips" id="skpick"></div>
 </div>
 <div class="panel"><h2>Save and share</h2>
  <div class="row"><button class="btn" id="copy">Copy character code</button><button class="btn alt" id="print">Print sheet</button></div>
  <label>Character code (paste to load)</label><textarea id="code" rows="3"></textarea>
  <button class="btn alt" id="load" style="margin-top:8px">Load code</button>
  <div class="mini" id="msg" style="margin-top:6px"></div>
 </div>
</div>
<div class="right" id="sheet"></div>
</div>
<script>
const DATA = {"sr": {"name": "Soul Reaper", "color": "#E4701E", "feats": [[1, "Zanpakutō", "You carry a bonded spirit blade. In its <i>sealed</i> form it is a martial melee weapon dealing 1d8 slashing damage, with the <i>finesse</i> and <i>versatile (1d10)</i> properties. You are proficient with it and may use Strength or Dexterity for its attack and damage rolls. It is a spiritual weapon: it ignores resistance to nonmagical slashing damage and harms Spiritual creatures fully. If it is disarmed or lost, it returns to your hand as a bonus action while it is within 100 feet. You may choose its form (katana, spear, glaive, etc.) when you create the character."], [1, "Shunpo (Flash Step)", "As a bonus action, spend 1 RP: you move up to your speed without provoking opportunity attacks. You may use Shunpo once per turn at this level."], [1, "Kidō Training", "You learn incantation magic. Your spirit ability for Kidō is Wisdom. Your <b>Kidō save DC</b> = 8 + proficiency bonus + Wisdom modifier. Your <b>Kidō attack bonus</b> = proficiency bonus + Wisdom modifier. You know a number of Kidō shown in the class table and may replace one each time you gain a level. Casting a Kidō costs RP (cost by tier in Chapter 10)."], [2, "Shikai", "Your zanpakutō speaks its name. Choose a subclass (Zanpakutō Type), below. <b>Release (bonus action, 2 RP):</b> speak your release command. For 1 minute your blade takes its released form and your subclass's Shikai traits apply. You can end it as a free action. It also ends if you fall unconscious."], [3, "Zanjutsu Style", "Choose one: <b>Duelist</b> (+2 damage with a one-handed melee weapon if your other hand is empty), <b>Two-Handed Mastery</b> (when you roll a 1 or 2 on a damage die with a two-handed melee weapon, reroll it once), or <b>Guardian</b> (+1 AC while wielding your zanpakutō)."], [5, "Extra Attack", "When you take the Attack action you may attack twice."], [7, "Flash Evasion", "When a creature you can see attacks you, you can use your reaction and spend 1 RP to impose disadvantage on the attack, and then move up to 10 feet without provoking opportunity attacks."], [9, "Unbroken Spirit", "When you fail a saving throw you can reroll it. You must use the new roll. Once per long rest."], [10, "Hold the Line", "Once per short rest, as a bonus action, regain 1d10 + your Soul Reaper level HP."], [11, "Bankai", "Your subclass grants you its Bankai (see subclass). <b>Release (bonus action, 6 RP; once per long rest; Spirit Gate 14):</b> lasts 1 minute and requires Shikai to be active (it is activated for free when you use Bankai). While Bankai is active, your Shikai traits remain and the Bankai traits apply as well."], [13, "Reiatsu Reserve", "Your maximum RP increases by 5."], [14, "Master Swordsman", "You can attack three times when you take the Attack action."], [15, "Peerless Spirit", "You gain one skill proficiency of your choice and Unbroken Spirit can be used twice per long rest."], [18, "Ever-Burning Soul", "When you roll initiative and have fewer than half your maximum RP, regain RP equal to half your maximum. Once per long rest."], [20, "True Unity (capstone, Spirit Gate 16)", "You may use Bankai twice per long rest. While in Bankai your attack rolls score a critical hit on 19-20 and Shunpo costs 0 RP."]], "subs": [{"name": "Yamamoto", "kind": "Elemental Zanpakutō", "flavor": "Fire, ice, lightning or the shaking of the earth. Your blade is a living element.", "feats": [[2, "Elemental Shikai", "Choose an element: <b>Flame</b> (fire), <b>Frost</b> (cold), <b>Storm</b> (lightning) or <b>Quake</b> (thunder). While released, your zanpakutō deals an extra 1d4 damage of that type on each hit (1d6 at level 9+), and you have resistance to that damage type."], [6, "Elemental Wave", "While released, as an action spend 3 RP: unleash a 30-foot cone (or 60-foot line, 5 feet wide) of your element. Dexterity save; 4d6 damage, half on success. The damage becomes 6d6 at level 11 and 8d6 at level 17."], [11, "Elemental Bankai", "Your element floods the battlefield. While Bankai is active: your extra elemental damage becomes 2d6; a 15-foot aura surrounds you and enemies who start their turn in it take 2d6 damage of your element; your speed increases by 10 feet; and Elemental Wave costs 0 RP once per turn."], [17, "Element Incarnate", "You are immune to damage of your element. Once per Bankai, you can use Elemental Wave as a bonus action."]]}, {"name": "Aizen", "kind": "Mirage Zanpakutō", "flavor": "Blur, mist and false victories. Your blade fights with deception.", "feats": [[2, "Mirage Shikai", "<b>Afterimage:</b> while released, the first attack made against you each round has disadvantage. <b>Disorient (bonus action, 1 RP):</b> one creature within 30 feet makes a Wisdom save. On a failure, its next attack roll before the end of its next turn has disadvantage and your next attack against it has advantage."], [6, "Veil of Duplicates", "While released, as an action spend 3 RP: you create 3 illusory duplicates for 1 minute. When a creature attacks you, roll a d20: on a 11+ (with 3 duplicates), 14+ (2) or 17+ (1) the attack targets a duplicate instead. A duplicate has AC 10 + your DEX modifier and is destroyed by any hit."], [11, "Mirage Bankai: Total Illusion", "While Bankai is active, at the start of your turn each hostile creature within 30 feet makes a Wisdom save. On a failure it is <i>deceived</i> until the start of your next turn: it has disadvantage on attacks against you, and you have advantage on attacks against it. Once per turn you may swap places with a duplicate for 0 RP."], [17, "Perfect Mirage", "You now create 5 duplicates with Veil of Duplicates (roll 11+, 13+, 15+, 17+, 19+ to hit the duplicate). Deceived creatures also take 3d6 psychic damage at the start of their turn."]]}, {"name": "Zaraki", "kind": "Brute Zanpakutō", "flavor": "No tricks. Your blade is raw, crushing power.", "feats": [[2, "Heavy Shikai", "While released, your zanpakutō grows: it deals 2d6 slashing damage, gains the <i>reach</i> property (10 feet) and counts as a two-handed weapon. When you release, you gain temporary hit points equal to your level + Wisdom modifier."], [6, "Crushing Blow", "Once per turn when you hit with your zanpakutō while released, you may spend 2 RP to add 1d8 damage. The target makes a Strength save or is knocked prone and pushed 10 feet away."], [11, "Titan Bankai", "While Bankai is active, you become Large (if space allows). Your zanpakutō deals 3d6 slashing damage and has reach 15 feet. You have advantage on Strength checks and saves. Whenever you hit a Large or smaller creature, you may push it 10 feet."], [17, "Unbreakable Titan", "Once per long rest, if you drop to 0 HP during Bankai, you instead drop to 1 HP, your Bankai ends, and you can immediately use Hold the Line as a free action if you have not used it. Your zanpakutō ignores resistance to slashing damage."]]}, {"name": "Urahara", "kind": "Binding Zanpakutō", "flavor": "Chains, seals and healing light. Your blade supports your allies and shackles your enemies, and you are the best Kidō user in the world.", "feats": [[2, "Binding Shikai", "<b>Anchored Strike:</b> while released, when you hit with your zanpakutō the target makes a Strength save (Kidō DC) or its speed becomes 0 until the start of its next turn. <b>Efficient Casting:</b> once per turn you can reduce the RP cost of a Kidō you cast by 1 (minimum 1)."], [6, "Kaidō Hands", "While released, as a bonus action spend 2 RP: touch a creature to restore 3d6 + Wisdom modifier HP. You can use this once per turn."], [11, "Binding Bankai: Chain Domain", "While Bankai is active, a 30-foot radius around you becomes your domain. Enemies in it have their speed halved. Once per turn you may cast a Kidō of tier 1 or 2 as a bonus action. Allies who start their turn in the domain regain 1d6 HP."], [17, "Seal Master", "You learn the tier 6 Kidō (Chapter 10) and gain one extra Kidō known. Once per long rest you may cast the Kidō <i>Kin</i> without spending RP. Your Kidō ignore resistance to their damage."]]}], "hd": 10, "spirit": "WIS", "saves": ["STR", "WIS"], "skillN": 2, "skillOpts": ["Athletics", "Acrobatics", "Hōhō", "Insight", "Intimidation", "Perception", "Reiatsu Sensing", "Spirit Lore", "Zanjutsu"], "armor": "Light armor", "weapons": "Simple weapons, martial weapons, your zanpakutō", "rpBonus": [[13, 5]], "asi": [4, 8, 12, 16, 19]}, "qu": {"name": "Quincy", "color": "#2F86C6", "feats": [[1, "Reishi Bow", "As a free action you can form or dismiss a bow of spirit particles in one hand. It is a ranged weapon with range 80/240 feet, dealing the damage in the Bow die column (see table) of <b>force</b> damage. It needs no ammunition, uses Dexterity and is two-handed in appearance but occupies one hand. You have proficiency with it. You do not suffer disadvantage for making ranged attacks against creatures within 5 feet. It harms Spiritual creatures fully."], [1, "Reishi Reclaim", "Once per turn when you hit with the Reishi Bow, you regain 1 RP."], [1, "Concentrated Shot", "When you hit with the Reishi Bow, you can spend up to your proficiency bonus in RP. Each RP spent adds 1d6 force damage to that hit."], [2, "Quincy Art", "Choose a subclass (below). Your art determines your signature techniques and your Vollständig."], [3, "Hirenkyaku", "As a bonus action, spend 1 RP to take the Dash or Disengage action."], [3, "Seele Schneider", "You carry blades tuned to spirit. A Seele Schneider is a light finesse melee weapon (1d6 force) with the thrown property (20/60). When you hit a creature with it, the target makes a Constitution save (DC 8 + proficiency + Intelligence modifier) or cannot take reactions and has its speed reduced by 10 feet until the start of your next turn. A thrown blade returns to you at the end of your turn."], [5, "Extra Attack", "When you take the Attack action, you can attack twice."], [7, "Blut Vene", "As a bonus action, spend 3 RP: for 1 minute you have resistance to bludgeoning, piercing and slashing damage. It ends early if you fall unconscious."], [9, "Arrow Volley", "As an action, spend 3 RP: make one Reishi Bow attack roll against every creature in a 10-foot radius within the bow's normal range."], [10, "Sniper's Eye", "You ignore half and three-quarters cover when attacking with the bow, and have no disadvantage at long range."], [11, "Vollständig", "Your art grants a Vollständig (see subclass). <b>Release (bonus action, 6 RP; once per long rest; Spirit Gate 14):</b> for 1 minute your spirit particles take their most complete form. In any Vollständig you gain a flying (hover) speed of 30 feet and +2 to your technique save DC."], [13, "Spirit Gathering", "Once per long rest, as an action, regain 10 RP."], [14, "Reishi Overflow", "When you hit with the Reishi Bow, you can reroll the extra dice of Concentrated Shot once."], [15, "Strike on the Move", "After you use Hirenkyaku, you can make one Reishi Bow attack as part of the same bonus action."], [18, "Perfect Shot", "When you make an attack roll with the Reishi Bow and roll a 9 or lower on the d20, you can treat the roll as a 10."], [20, "Zenith of Light (capstone, Spirit Gate 16)", "Your Reishi Bow attacks score a critical hit on 19-20. Once per long rest, as an action, spend 15 RP: fire a beam in a 120-foot line, 10 feet wide. Each creature in it makes a Dexterity save (technique DC) and takes 10d10 force damage, or half on a success."]], "subs": [{"name": "Uryū Ishida", "kind": "Marksman Art", "flavor": "One arrow. One answer.", "feats": [[2, "Steady Aim", "As a bonus action, you take aim: your next Reishi Bow attack this turn has advantage and deals an extra 1d6 force damage, but only if you did not move this turn."], [6, "Piercing Arrow", "When you hit with the Reishi Bow, the shot continues. A second creature in a straight line behind the first, within 30 feet, takes half the damage. Your bow ignores resistance to force damage."], [11, "Vollständig: Marksman", "While active: bow range becomes 150/450 feet, your attacks score critical hits on 19-20, and the first hit on your turn deals an extra 2d6 force damage."], [17, "Killing Focus", "Your bow attacks deal an extra 1d8 damage against creatures below half HP. When you critically hit, roll triple (not double) damage dice."]]}, {"name": "Sōken Ishida", "kind": "Blade Art", "flavor": "Close in and cut the spirit itself.", "feats": [[2, "Blade Dancer", "When you take the Attack action with the Reishi Bow, you can use your bonus action to attack with a Seele Schneider. While you wield one, you have +1 AC."], [6, "Severing Cut", "When you hit with a Seele Schneider, spend 2 RP: the target makes a Constitution save or cannot spend RP or use reactions until the start of your next turn. It also takes an extra 2d6 force damage."], [11, "Vollständig: Blade Storm", "While active: Seele Schneider damage becomes 1d10, you can attack with it three times with the Attack action, and your wings strike as an additional bonus-action attack (1d8 force, reach 10 feet)."], [17, "Reishi Sever", "Your Seele Schneider attacks ignore resistance and immunity to force damage. On a critical hit the target loses 10 RP (or is stunned until the end of its next turn if it does not track RP)."]]}, {"name": "Haschwalth", "kind": "Ward Art", "flavor": "A guardian's light. You are the wall between your friends and the enemy.", "feats": [[2, "Guard Wall", "As a reaction, spend 1 RP when you or an ally within 30 feet is hit: the target gains +3 AC against that attack, which may turn the hit into a miss. <b>Warding Bow:</b> when you hit an ally with the Reishi Bow by choice, they instead regain 1d8 HP and no damage is dealt."], [6, "Barrier Dome", "As an action, spend 3 RP: create a 10-foot radius dome of light centered on a point within 60 feet for 1 minute (concentration). Creatures of your choice in it have half cover and resistance to force and radiant damage."], [11, "Vollständig: Sanctuary", "While active: you carry a 20-foot radius aura. Allies in it gain +2 AC and advantage on saves against being frightened, charmed or stunned. Barrier Dome costs 1 RP while active."], [17, "Last Stand", "While Vollständig is active, the first time each ally would drop to 0 HP (once per long rest per ally), they drop to 1 HP instead and gain 10 temporary hit points."]]}, {"name": "Bazz-B", "kind": "Blaze Art", "flavor": "Your Letter is Heat. Every arrow arrives already burning.", "feats": [[2, "Blaze Letter", "When you hit with the Reishi Bow, you may spend 1 RP: the hit deals +1d6 fire damage and the target catches fire (1d6 fire at the start of each of its turns, until a creature uses an action to put it out)."], [6, "Blaze Burst", "As an action, spend 3 RP: a 20-foot radius sphere centered on a point you can see within 90 feet erupts in flame. Dexterity save; 5d6 fire damage, half on success. Creatures that fail also catch fire."], [11, "Vollständig: Blaze Complete", "While active: the Blaze Letter on-hit effect costs 0 RP once per turn, Blaze Burst costs 2 RP and deals 8d6, and your arrows deal +1d6 fire damage."], [17, "Cinder Crown", "You are immune to fire damage. At the start of each of your turns, every burning creature within 30 feet takes 2d6 fire damage (no RP). Blaze Burst deals 10d6 and ignores resistance to fire."]]}], "hd": 8, "spirit": "INT", "saves": ["DEX", "INT"], "skillN": 2, "skillOpts": ["Acrobatics", "Hōhō", "Insight", "Investigation", "Perception", "Reiatsu Sensing", "Sleight of Hand", "Spirit Lore", "Stealth", "Survival"], "armor": "Light armor", "weapons": "Simple weapons, Reishi Bow, Seele Schneider", "asi": [4, 8, 12, 16, 19]}, "hb": {"name": "Hollowborn", "color": "#C0272D", "feats": [[1, "Inner Hollow", "<b>Hollow's Hide:</b> while you are not wearing armor, your AC is 10 + DEX modifier + CON modifier. <b>Hollow's Claw:</b> your unarmed strikes deal the Claw die listed in the table, count as spiritual and can use Strength or Dexterity. You are proficient with them."], [1, "Hollow Surge", "As a bonus action, spend 2 RP: your inner hollow rises for 1 minute. While surging you: gain the Surge damage bonus on melee damage rolls; have resistance to bludgeoning, piercing and slashing damage; have advantage on Strength checks and Strength saves; cannot concentrate on effects. The Surge ends early if you did not attack a hostile creature or take damage since your last turn, or if you choose to end it (free action)."], [1, "Cero", "As an action, spend 3 RP: fire a destructive beam in a line 5 feet wide and 30 feet long (60 feet at level 5, 90 feet at level 11). Each creature in the line makes a Dexterity save (<b>Cero DC</b> = 8 + proficiency bonus + Constitution modifier) and takes force damage as shown in the Cero column, or half on a success."], [2, "Hollow Nature", "Choose a subclass (below). It shapes how your hollow behaves. <b>Hollow Senses:</b> you have advantage on initiative rolls and on Wisdom (Perception) checks that rely on smell or hearing."], [3, "Hollow Vitality", "While surging, at the start of your turn, if you have at least 1 HP, you regain HP equal to your proficiency bonus."], [5, "Extra Attack and Fast Movement", "You can attack twice when you take the Attack action. Your speed increases by 10 feet while you are not wearing armor."], [7, "Hollow Reflexes", "When you succeed on a Dexterity save that would deal half damage on success, you take none. On a failure you take half."], [9, "Cero Amplification", "When you fire a Cero, you may spend up to 3 additional RP. Each extra RP adds 1d6 damage."], [10, "Unyielding Will", "While surging, when you would drop to 0 HP you can make a Constitution save (DC 5 + damage taken). On a success you drop to 1 HP instead. Usable once per long rest."], [11, "Ultimate Form", "Your Hollow Nature grants an ultimate form (see subclass). <b>Activation (bonus action, 6 RP; once per long rest; Spirit Gate 14):</b> you must be surging to activate it. Lasts 1 minute."], [13, "Brutal Surge", "The first time you hit on your turn while surging, add one extra weapon or claw damage die."], [14, "Overwhelming Pressure", "Reiatsu Pressure costs you 1 RP, has a 30-foot radius, and creatures of level or CR up to your level + 4 are affected. They have disadvantage on the save."], [15, "Persistent Surge", "Your Surge lasts 10 minutes and does not end early. If you roll initiative with 0 RP, regain 4 RP."], [18, "Indomitable Might", "If your total on a Strength check or Strength save is lower than your Strength score, use your score."], [20, "Primal Hollow (capstone, Spirit Gate 16)", "Your Strength and Constitution increase by 4, to a maximum of 25. Once per turn you can fire a Cero as a bonus action for 1 RP."]], "subs": [{"name": "Shinji Hirako", "kind": "Vizard", "flavor": "You pulled the mask on yourself. You decide when it goes on and when it comes off.", "feats": [[2, "Controlled Mask", "You gain proficiency with martial weapons and the Surge damage bonus applies to weapon attacks too. The Surge's early-ending condition does not apply to you: you can take any action while surging, including speaking, bargaining and retreating."], [6, "Mask Burst", "Once per turn when you hit with a melee attack while surging, spend 2 RP to add 3d6 force damage to the hit."], [11, "Full Mask", "<b>Ultimate Form.</b> A full hollow mask covers your face. For 1 minute: +2 to attack and damage rolls; 20 temporary hit points; Cero costs 1 RP and gains +2d6 damage; +20 feet speed; you cannot be frightened or charmed. When the Full Mask ends, gain 1 level of exhaustion unless you pay 3 RP."], [17, "Mask Mastery", "Full Mask lasts 10 minutes and no longer causes exhaustion. You can use it twice per long rest."]]}, {"name": "Grimmjow", "kind": "Feral", "flavor": "Instinct first. Thought later. You hunt.", "feats": [[2, "Sonído", "As a bonus action, spend 1 RP: move up to your speed without provoking opportunity attacks. <b>Pounce:</b> if you moved at least 15 feet in a st  </div>
 <div class="panel"><h2>Skills</h2>
  <div class="sk">${SKILLS.map(([s,a])=>`<div class="${skp.has(s)?"p":""}"><span>${s} (${a})</span><b>${sgn(mod(T[a])+(skp.has(s)?P:0))}</b></div>`).join("")}</div>
  <div class="mini" style="margin-top:6px">Passive Perception: ${10+mod(T.WIS)+(skp.has("Perception")?P:0)}. Weapons: ${C.weapons}. Armor: ${C.armor}.</div>
 </div>
 <div class="panel"><h2>Features</h2>
  ${all.map(f=>`<div class="feat"><h4><small>${f[3]?"SUBCLASS ":"CLASS "}&middot; LV ${f[0]}</small>${f[1]}</h4><p>${f[2]}</p></div>`).join("")}
  ${L<2?`<div class="note">Subclass features start at level 2.</div>`:""}
 </div>
 <div class="note noprint">Kidō, Imprints, gear and relics are chosen at the table with your GM: see Chapters 9 and 10 in the Player's Handbook. Fan-made game inspired by <i>Bleach</i>; not affiliated with the creator or publishers.</div>`;
}
init();
</script>
